name: Release

# Two ways in, one job.
#
#   * workflow_dispatch — cut the release here: bump, changelog, commit,
#     tag, push, build, publish. Use this when you have no local toolchain.
#   * push of a vX.Y.Z tag — you cut it locally with `just release`; this
#     builds and publishes it.
#
# They are one workflow rather than two on purpose. A push made with the
# default GITHUB_TOKEN does not trigger further workflows, so a separate
# "cut" workflow that pushed a tag would never fire the build. The dispatch
# path therefore carries the job through to the end itself.
#
# A tag name reaches the shell of later steps, and git allows a quote, `;`,
# `$(` or a backtick in one. So the name is checked as exactly vX.Y.Z
# before any step reads it, and every expression reaches a script through
# env:, never pasted into its text (src/lib/testing/releasePath.test.ts
# fails on a paste).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      part:
        description: 'Which part of the version to bump'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write # create the GitHub Release, and push the release commit and tag

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The `v*.*.*` filter above lets a name such as v1.0.0';id;' through,
      # so a tag push stops here unless the name is exactly vX.Y.Z, before
      # anything is checked out or run. The name is read from the
      # environment, never pasted into the script, so this check runs no
      # part of it.
      - name: check the tag name
        if: github.event_name == 'push'
        shell: bash
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'ERROR: the tag name %q is not vX.Y.Z; nothing is built or released\n' "$GITHUB_REF_NAME"
            exit 1
          fi
          printf 'tag name %s is vX.Y.Z\n' "$GITHUB_REF_NAME"

      - name: checkout
        uses: actions/checkout@v7
        with:
          # scripts/release.sh derives the version from `git describe`, so
          # it needs the tags and the full history.
          fetch-depth: 0
          # The dispatch path pushes a commit back, so check out the branch
          # itself rather than a detached SHA.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: setup-just
        uses: extractions/setup-just@v4

      - name: install
        run: just install

      # Before the tag is created, not after: a release must never be cut
      # from a tree that does not pass. This is the same `just ci` the
      # local `just release` runs first.
      - name: gates
        run: just ci

      # Only on the dispatch path. scripts/release.sh refuses a dirty tree
      # or a branch other than main, promotes [Unreleased] in the
      # changelog, commits and tags. It prints "nothing has been pushed" —
      # true of the script; the next lines here do the pushing.
      #
      # If this step fails with "protected branch", either allow
      # github-actions[bot] to push to main or cut releases locally.
      - name: cut the release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          PART: ${{ inputs.part }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/release.sh "$PART"
          tag=$(git describe --tags --abbrev=0)
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'ERROR: the tag name %q is not vX.Y.Z; nothing is pushed\n' "$tag"
            exit 1
          fi
          git push origin HEAD:main
          git push origin "refs/tags/${tag}"

      # One name for both paths, checked as vX.Y.Z before a later step
      # reads it. On a tag push the ref is the tag; after a dispatch cut,
      # HEAD is the commit that was just tagged.
      - name: resolve the tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=$(git describe --tags --abbrev=0)
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'ERROR: the tag name %q is not vX.Y.Z; nothing is released\n' "$tag"
            exit 1
          fi
          echo "Releasing ${tag}"
          echo "name=${tag}" >> "$GITHUB_OUTPUT"

      # `just package` builds, asserts index.html is at the archive root,
      # and writes the sha256 sidecar. It stamps the tag resolved above,
      # which was checked as vX.Y.Z: `git describe`, the justfile's default
      # version, prints an annotated tag in preference to the lightweight
      # one scripts/release.sh makes, so another tag on the release commit
      # would be stamped in its place.
      - name: package
        shell: bash
        env:
          TAG: ${{ steps.release_tag.outputs.name }}
        run: just --set version "$TAG" package

      # The stamped version must be the tag itself, not a name that only
      # contains it.
      - name: verify the bundle carries the tag
        env:
          TAG: ${{ steps.release_tag.outputs.name }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('dist/version.json'))['version'])")
          echo "dist/version.json version: $version"
          [ "$version" = "$TAG" ] \
            || { echo "ERROR: version.json ($version) does not match $TAG"; exit 1; }

      - name: release notes
        run: |
          set -euo pipefail
          just release-notes "${TAG#v}" > release-notes.md
          cat release-notes.md
        env:
          TAG: ${{ steps.release_tag.outputs.name }}

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.name }}
          files: |
            dist.tar.gz
            dist.tar.gz.sha256
          body_path: release-notes.md
          fail_on_unmatched_files: true
