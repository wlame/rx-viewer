name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # `just version` stamps `git describe`.
          fetch-depth: 0

      - name: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: "latest" makes the build depend on the day it ran.
          bun-version: 1.3.14

      - name: setup-just
        uses: extractions/setup-just@v4

      # --frozen-lockfile fails when package.json and bun.lock disagree,
      # which is what makes the install reproducible.
      - name: install
        run: just install

      - name: just ci
        run: just ci

      - name: upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: setup-just
        uses: extractions/setup-just@v4

      - name: install
        run: just install

      # Reports rather than gates: an outdated dependency should be visible
      # without blocking an unrelated fix.
      - name: just audit
        run: just audit
        continue-on-error: true
